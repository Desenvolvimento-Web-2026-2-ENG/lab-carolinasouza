<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Horária de Aulas do Módulo</title>
</head>

<body>

    <header>
        <h1>Grade Horária de Aulas do Módulo</h1>
    </header>

    <main>
       
        <section class="bloco-cronograma">
            <h2 class="titulo-seccao">Horários acadêmicos</h2>
            
            <table>
                <caption>Horários das Aulas</caption>
                <thead>
                    <tr>
                        <th scope="col">Aula</th>
                        <th scope="col">Horário</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Estruturação Multimídia</td>
                        <td>19:00 - 20:30</td>
                    </tr>
                </tbody>
            </table>
            
            <p>Recursos necessários:</p>
            <ul>
                <li>Computador com IDE configurada</li>
                <li>Arquivos de legenda (.vtt) prontos</li>
            </ul>
        </section>

        <hr>

        <section class="bloco-video">
            <h2>Apresentação da Disciplina</h2>
            <video controls="controls">
                <source src="https://dl6.webmfiles.org/big-buck-bunny_trailer.webm" type="video/webm">
                <track src="legendas.vtt" kind="captions" srclang="pt" label="Português">
                <p>Seu navegador não suporta Video em HTML5.</p>
            </video>
        </section>

        <section class="bloco-mapa">
            <h2>Localização do Campus IFF</h2>
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3705.4768365739183!2d-41.33936682387425!3d-21.761798780077335!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xbdd43f2476c3ad%3A0xb32af6e0cbf8c2f8!2sIFF%20Campos%20Centro!5e0!3m2!1spt-BR!2sbr!4v1793819155716!5m2!1spt-BR!2sbr" 
                title="Mapa interativo de localização do IFF Campos Centro via Google Maps"
                width="600" 
                height="450" 
                style="border:0;" 
                allowfullscreen="" 
                loading="lazy" 
                referrerpolicy="strict-origin-when-cross-origin"
                sandbox="allow-scripts allow-same-origin">
                <p>Seu navegador não suporta iFrame em HTML5.</p>
            </iframe>
        </section>
    </main>

</body>
</html>
